<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RoadQuiz — Tesla Yolcu Oyunu</title><link rel="stylesheet" href="/style.css?v=8"><link rel="stylesheet" href="/patch.css?v=8"><style>#rqPassengerGate{position:fixed;inset:0;z-index:999999;background:rgba(4,6,10,.82);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:20px}#rqPassengerGate .gate-card{width:min(460px,100%);background:#111318;border:1px solid rgba(255,255,255,.16);border-radius:26px;padding:30px;box-shadow:0 30px 100px rgba(0,0,0,.65);text-align:center}#rqPassengerGate h2{margin:8px 0 10px;font-size:30px}#rqPassengerGate p{margin:0 0 22px;color:rgba(255,255,255,.68);line-height:1.5}#rqPassengerGate .btn{width:100%}body.rq-gated{overflow:hidden}body.rq-gated #app{pointer-events:none;user-select:none}</style></head><body><div id="app"></div><script src="/app.js?v=8"></script><script src="/patch.js?v=12"></script><script src="/final.js?v=8"></script><script>(function(){if(location.pathname!=='/')return;document.body.classList.add('rq-gated');function cleanHome(){var p=document.getElementById('passenger');if(p)p.remove();var box=document.getElementById('passengerBox');if(box)box.remove();var actions=document.querySelector('.home-actions');if(actions&&actions.children.length===1){var create=document.getElementById('create');if(create&&actions.parentNode){actions.parentNode.insertBefore(create,actions);actions.remove()}}}function showGate(){cleanHome();if(document.getElementById('rqPassengerGate'))return;var gate=document.createElement('div');gate.id='rqPassengerGate';gate.innerHTML='<div class="gate-card"><div class="eyebrow">PASSENGER SAFETY</div><h2>Yolcu olduğunuzu doğrulayın</h2><p>RoadQuiz yalnızca araçtaki yolcular için kullanılmalıdır. Devam etmek için yolcu olduğunuzu onaylayın.</p><button id="rqConfirmPassenger" type="button" class="btn primary bigbtn">Ben Yolcuyum</button></div>';document.body.appendChild(gate);document.getElementById('rqConfirmPassenger').onclick=function(){gate.remove();document.body.classList.remove('rq-gated');cleanHome()}}setTimeout(showGate,0);setTimeout(function(){cleanHome();showGate()},250);var observer=new MutationObserver(function(){cleanHome()});observer.observe(document.getElementById('app'),{childList:true,subtree:true})})();</script></body></html>
