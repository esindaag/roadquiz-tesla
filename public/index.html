<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RoadQuiz — Tesla Yolcu Oyunu</title><link rel="stylesheet" href="/style.css?v=8"><link rel="stylesheet" href="/patch.css?v=8"></head><body><div id="app"></div><script src="/app.js?v=8"></script><script src="/patch.js?v=12"></script><script src="/final.js?v=8"></script><script>(function(){function installPassengerJoin(){if(location.pathname!=='/')return;var create=document.getElementById('create');if(!create)return;var actions=document.querySelector('.home-actions');if(!actions){actions=document.createElement('div');actions.className='home-actions';create.parentNode.insertBefore(actions,create);actions.appendChild(create)}var old=document.getElementById('passengerBox');if(old)old.style.display='none';var btn=document.getElementById('passenger');if(!btn){btn=document.createElement('button');btn.id='passenger';btn.className='btn secondary bigbtn';btn.type='button';btn.textContent='Ben Yolcuyum';actions.appendChild(btn)}btn.style.display='block';btn.onclick=function(){var existing=document.getElementById('rqPassengerModal');if(existing){existing.style.display='flex';return}var modal=document.createElement('div');modal.id='rqPassengerModal';modal.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.76);backdrop-filter:blur(9px);display:flex;align-items:center;justify-content:center;padding:18px';modal.innerHTML='<div style="position:relative;width:min(440px,100%);background:#111318;border:1px solid rgba(255,255,255,.16);border-radius:24px;padding:26px;box-shadow:0 28px 90px rgba(0,0,0,.6)"><button id="rqClosePassenger" type="button" style="position:absolute;right:16px;top:14px;border:0;background:transparent;color:#fff;font-size:28px;cursor:pointer">×</button><div class="eyebrow">PASSENGER MODE</div><h2 style="margin:8px 0 18px">Oda kodunu gir</h2><input id="rqRoomInput" class="input" inputmode="numeric" maxlength="6" placeholder="000000" style="width:100%;text-align:center;letter-spacing:.22em;font-weight:800;margin-bottom:12px"><button id="rqConfirmRoom" class="btn primary full" type="button">Onayla →</button><div id="rqHomeErr" style="min-height:20px;margin-top:10px;color:#ff9a9a;font-size:13px"></div></div>';document.body.appendChild(modal);var input=document.getElementById('rqRoomInput'),err=document.getElementById('rqHomeErr');function close(){modal.remove()}document.getElementById('rqClosePassenger').onclick=close;modal.addEventListener('click',function(e){if(e.target===modal)close()});async function go(){var code=(input.value||'').replace(/\D/g,'').slice(0,6);input.value=code;err.textContent='';if(code.length!==6){err.textContent='6 haneli oda kodunu gir.';return}try{var r=await fetch('/api/rooms/'+code);if(!r.ok)throw new Error('room_not_found');location.href='/join/'+code}catch(e){err.textContent='Bu oda bulunamadı. Kodu kontrol et.'}}document.getElementById('rqConfirmRoom').onclick=go;input.onkeydown=function(e){if(e.key==='Enter')go()};input.oninput=function(){input.value=input.value.replace(/\D/g,'').slice(0,6)};setTimeout(function(){input.focus()},50)}}setTimeout(installPassengerJoin,0);setTimeout(installPassengerJoin,250)})();</script></body></html>
